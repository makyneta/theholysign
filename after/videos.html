<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com">

    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="The Holy Sign — vídeos oficiais.">

    <!-- Styles -->
    <link rel="stylesheet" href="videos.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="main.js" defer></script>
    <script src="videos.js" defer></script>

    <!-- Favicon, OGImage, Title -->
    <meta property="og:image" content="/assets/images/ogimg.webp">
    <link rel="icon" href="/favicon.png">
    <title>Vídeos — The Holy Sign</title>
</head>

<body class="videos-page">
    <div id="site-header"></div>

    <!-- Imagem de fundo da página (muda o caminho se quiseres outra) -->
    <div class="videos-bg" style="--bg-img:url(/assets/images/band/tour-bg.webp)" aria-hidden="true"></div>

    <main class="videos-main">
        <div class="videos-wrap">
            <h1 class="videos-title">Vídeos</h1>

            <!-- Preenchido automaticamente pelo videos.js (lista VIDEOS no topo desse ficheiro) -->
            <div class="videos-grid" id="videos-grid"></div>

            <p class="videos-empty" id="videos-empty" hidden>Ainda não há vídeos publicados.</p>
        </div>
    </main>

    <!-- Popup do YouTube -->
    <dialog class="vd" id="video-dialog" aria-label="Vídeo">
        <button class="vd-close" id="video-close" type="button" aria-label="Fechar vídeo"></button>
        <div class="vd-frame" id="video-frame"></div>
    </dialog>

    <div id="site-footer"></div>
</body>

</html>
