<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <!-- Redirecionamentos (atalhos de redes sociais e lançamentos). Tem de ficar no topo do head. -->
    <script>
     (function () {
        var REDIRECTS = {
         // Socials
          'instagram': { url: 'https://instagram.com/theholysign' },
          'facebook': { url: 'https://facebook.com/theholysign' },
          'tiktok': { url: 'https://tiktok.com/@theholysign' },
          'youtube': { url: 'https://youtube.com/@theholysignband' },
          'spotify': { url: 'https://open.spotify.com/artist/ID' },
          'applemusic': { url: 'https://music.apple.com/artist/ID' },
          'deezer': { url: 'https://deezer.com/artist/ID' },

           // Releases
           'smooth-operator': { url: '/release/smooth-operator' }
       };

       var slug = window.location.pathname.split('/').filter(Boolean).pop();
        if (slug) {
         slug = slug.toLowerCase().replace(/\.html$/, '');
          var dest = REDIRECTS[slug];
         if (dest) {
           if (dest.url.indexOf('mailto:') !== 0) document.documentElement.style.visibility = 'hidden';
            window.location.replace(dest.url);
         }
       }
     })();
    </script>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Metadados -->
    <meta name="robots" content="noindex">
    <meta name="description" content="Página não encontrada — The Holy Sign.">

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/styles/main.css">
    <link rel="stylesheet" href="/assets/styles/404.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Scripts (cabeçalho e rodapé) -->
    <script src="/assets/scripts/main.js" defer></script>

    <!-- Favicon, Title -->
    <link rel="icon" href="/favicon.png">
    <title>404 | The Holy Sign</title>
</head>

<body class="nf-page">
    <!-- <div id="site-header"></div> -->

    <!-- Imagem de fundo da página (muda o caminho se quiseres outra) -->
    <div class="nf-bg" style="--bg-img:url(/assets/images/ui/background.webp)" aria-hidden="true"></div>

    <main class="nf-main">
        <div class="nf-box">
            <p class="nf-code" aria-hidden="true">404</p>
            <h1 class="nf-title">Página não encontrada</h1>
            <p class="nf-text">A página que procuras não existe ou mudou de sítio.</p>
            <div class="nf-actions">
                <a class="btn btn-outline" href="/">Voltar ao início</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
</body>

</html>
