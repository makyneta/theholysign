<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="The Holy Sign — datas de concertos e bilhetes.">

    <!-- Styles -->
    <link rel="stylesheet" href="tour.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="main.js" defer></script>

    <!-- Favicon, OGImage, Title -->
    <meta property="og:image" content="/assets/images/ogimg.webp">
    <link rel="icon" href="/favicon.png">
    <title>Tour — The Holy Sign</title>
</head>

<body class="tour-page">
    <div id="site-header"></div>

    <!-- Imagem de fundo da página: coloca a tua em /assets/images/band/tour-bg.webp -->
    <div class="tour-bg" style="--bg-img:url(/assets/images/background/tour.webp)" aria-hidden="true"></div>

    <main class="tour-main">
        <div class="container">
            <h1 class="tour-title">Tour</h1>
            <p class="tour-sub" id="tour-sub" hidden>Bilhetes já à venda</p>

            <!-- As datas estão em SHOWS, no topo do main.js (as mesmas da página inicial) -->
            <div class="tour-list" id="tour-list" hidden></div>

            <!-- Aparece quando não há concertos -->
            <div class="tour-empty" id="tour-empty" hidden>
                <div class="tour-empty-date" aria-hidden="true">—</div>
                <h3>Sem concertos agendados</h3>
                <p>Estamos a preparar novas datas. Segue as nossas redes sociais para seres dos primeiros a saber.</p>
                <a class="btn btn-outline" href="/#contactos">Contactar</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
</body>

</html>
