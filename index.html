<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="The Holy Sign — pop/rock alternativo. O primeiro lançamento está a chegar.">

    <!-- Styles (esta página é independente: não precisa do style.css) -->
    <link rel="stylesheet" href="/assets/styles/soon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="/assets/scripts/soon.js" defer></script>
    <script src="/assets/scripts/main.js" defer></script>

    <!-- Favicon, OGImage, Title -->
    <meta property="og:title" content="The Holy Sign — Em breve">
    <meta property="og:image" content="/assets/images/ogimg.webp">
    <link rel="icon" href="/favicon.png">
    <title>The Holy Sign</title>
</head>

<body class="soon-page">

    <!-- ============ EM BREVE ============ -->
    <section class="soon-hero" id="inicio">
        <!-- Imagens do fundo: computador (--d) e telemóvel (--m) -->
        <div class="soon-hero-bg" style="--d:url(/assets/images/band/herosection/computer-v1.webp);--m:url(/assets/images/band/herosection/mobile-v2.webp)" aria-hidden="true"></div>

        <div class="soon-hero-c">
            <h1 class="soon-logo"><img src="/assets/images/logo.png" alt="The Holy Sign" onerror="this.replaceWith('The Holy Sign')"></h1>
            <p class="soon-kicker">Em breve</p>
            <p class="soon-text">O nosso primeiro lançamento está a chegar.</p>

            <!-- Contagem decrescente (opcional): escreve a data de estreia em data-launch (AAAA-MM-DDTHH:MM:SS).
                 Deixa data-launch="" e a contagem não aparece. -->
            <div class="soon-count" id="soon-count" data-launch="" hidden>
                <div><b data-unit="d">00</b><span>Dias</span></div>
                <div><b data-unit="h">00</b><span>Horas</span></div>
                <div><b data-unit="m">00</b><span>Min</span></div>
                <div><b data-unit="s">00</b><span>Seg</span></div>
            </div>

            <a class="btn-outline" href="#contactos">Contactar</a>
        </div>

        <a class="soon-scroll" href="#banda" aria-label="Descer"><i class="fa-solid fa-chevron-down"></i></a>
    </section>

    <!-- ============ BANDA ============ -->
    <section id="banda" class="lineup-sec">
        <div class="wrap">
            <h2 class="sec-heading">A Banda</h2>
            <!-- <p class="lineup-sub">Os quatro membros</p> -->
            <ul class="lineup">
                <li class="lineup-card rv">
                    <div class="lineup-img" style="--img:url(/assets/images/band/tomas-mota.webp)" role="img" aria-label="Nome do Membro 1"></div>
                    <div class="lineup-info"><b>Tomás Mota</b><span>Voz, Guitarra, Violão</span></div>
                </li>
                <li class="lineup-card rv">
                    <div class="lineup-img" style="--img:url(/assets/images/band/esdras-lopes.webp)" role="img" aria-label="Nome do Membro 2"></div>
                    <div class="lineup-info"><b>Esdras Lopes</b><span>Voz, Saxofone, Piano</span></div>
                </li>
                <li class="lineup-card rv">
                    <div class="lineup-img" style="--img:url(/assets/images/band/miguel-amaral.webp)" role="img" aria-label="Nome do Membro 3"></div>
                    <div class="lineup-info"><b>Miguel Amaral</b><span>Baixo</span></div>
                </li>
                <li class="lineup-card rv">
                    <div class="lineup-img" style="--img:url(/assets/images/band/daniel-santos.webp)" role="img" aria-label="Nome do Membro 4"></div>
                    <div class="lineup-info"><b>Daniel Santos</b><span>Bateria</span></div>
                </li>
            </ul>
        </div>
    </section>

    <!-- ============ CONTACTO ============ -->
    <section id="contactos" class="contact-sec" style="--photo:url(/assets/images/background/main.webp)">
        <div class="wrap contact-wrap">
            <h2 class="sec-heading">Contacto</h2>
            <!-- <p class="contact-sub">Concertos, imprensa e colaborações</p> -->

            <!-- Email e telefone -->
            <div class="contact-info">
                <a href="mailto:tomas@makyneta.dev"><i class="fa-solid fa-envelope"></i><span>tomas@makyneta.dev</span></a>
                <!-- <a href="tel:+351913936776"><i class="fa-solid fa-phone"></i><span>+351 91 393 67 76</span></a> -->
            </div>

            <!-- action: o endereço do teu serviço de formulários (ex.: Formspree) -->
            <form id="contact-form" action="https://formspree.io/f/moejwlde" method="POST">
                <div class="form-row">
                    <input type="text" name="name" placeholder="Nome" autocomplete="name" required>
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                </div>
                <textarea name="message" placeholder="Mensagem" required></textarea>
                <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
                <!-- <label class="check"><input type="checkbox" name="privacy" required><span>Li e aceito a <a href="/privacidade">Política de Privacidade</a>.</span></label> -->
                <button class="btn-outline" type="submit">Enviar</button>
                <p class="form-msg" id="form-msg" role="status"></p>
            </form>
        </div>
    </section>

    <div id="site-footer"></div>

</body>

</html>
